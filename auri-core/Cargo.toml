[package]
name = "auri-core"
version = "0.1.0"
edition = "2024"
description = "AURI Mobile Core: Rust-based YouTube Music engine and DSP processing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
jni = { version = "0.21", default-features = false }

[dev-dependencies]

